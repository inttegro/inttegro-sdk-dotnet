name: .NET SDK CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INTTEGRO_OPENAPI_SPEC: ${{ github.workspace }}/openapi/commerce.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inttegro/openapi
          ref: c518e5b722e40fc8b832e6bd7bfd71d9458ec954
          path: openapi
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/Inttegro.Tests/Inttegro.Tests.csproj --locked-mode

      - name: Build
        run: dotnet build tests/Inttegro.Tests/Inttegro.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Inttegro.Tests/Inttegro.Tests.csproj --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: "**/coverage.cobertura.xml"
          flags: dotnet
          name: dotnet-sdk
